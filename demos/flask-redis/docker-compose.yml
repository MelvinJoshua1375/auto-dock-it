services:
  app:
    build: .
    ports:
    - "8000:8000"
    depends_on:
    - redis
    environment:
    - REDIS_URL=redis://redis:6379/0
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:-}
  redis:
    image: redis:7
    volumes:
    - redis-data:/data
volumes:
  redis-data:
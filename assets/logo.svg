<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Three equal horizontal lines, centred. Minimalist mark symbolising
       stacked container layers. Black strokes on transparent so the mark
       sits cleanly on any light surface. -->
  <g stroke="#111111" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="32" y1="40" x2="68" y2="40"/>
    <line x1="32" y1="50" x2="68" y2="50"/>
    <line x1="32" y1="60" x2="68" y2="60"/>
  </g>
</svg>

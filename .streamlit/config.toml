# Auto-Dock It - monochrome "dark dashboard" theme.
# Near-black canvas, crisp white text, restrained grayscale accents.
# The actual UI styling is enforced via the injected CSS in autodock/web.py;
# the values here only set Streamlit's framework defaults so that components
# the CSS does not reach (eg native widgets in some Streamlit versions) still
# match the palette instead of flashing the default red.
[theme]
base = "dark"
primaryColor = "#fafafa"            # restrained near-white accent (buttons, focus)
backgroundColor = "#0a0a0a"         # near-black main canvas
secondaryBackgroundColor = "#151515"# panels, sidebar, code blocks
textColor = "#f5f5f5"               # crisp white primary text
font = "sans serif"

[server]
headless = true
